<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>종로백제약국(원조) 인스타그램 미리보기</title>
<meta property="og:title" content="종로백제약국(원조) 인스타그램 미리보기">
<meta property="og:description" content="블로그 글로 만든 인스타 게시물 샘플 3개">
<meta property="og:image" content="https://yeunsu0918.github.io/baekje-insta-sample/og.jpg">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:#fff;color:#000;-webkit-font-smoothing:antialiased}
.app{max-width:470px;margin:0 auto;min-height:100vh;background:#fff;position:relative}
.notice{background:#1f6f50;color:#fff;font-size:13px;text-align:center;padding:8px 12px;line-height:1.4}
.topbar{position:sticky;top:0;z-index:5;background:#fff;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #efefef}
.topbar .h{font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px}
.topbar .back{font-size:26px;line-height:1;cursor:pointer;width:28px}
.icons{display:flex;gap:18px}
svg{width:24px;height:24px;display:block}
.prof{padding:16px 16px 4px}
.prow{display:flex;align-items:center;gap:24px}
.av{width:86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);flex:none}
.av img{width:100%;height:100%;border-radius:50%;border:3px solid #fff;object-fit:cover;display:block}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px}
.stats span{font-size:13px}
.bio{margin-top:12px;font-size:14px;line-height:1.45}
.bio .nm{font-weight:700}
.bio .cat{color:#737373}
.btns{display:flex;gap:6px;margin:14px 0 6px}
.btn{flex:1;background:#efefef;border-radius:8px;text-align:center;font-weight:600;font-size:14px;padding:8px 0}
.btn.p{background:#0095f6;color:#fff}
.hl{display:flex;gap:16px;padding:10px 16px 14px;overflow-x:auto}
.hl div{text-align:center;font-size:12px;flex:none}
.hl i{display:block;width:62px;height:62px;border-radius:50%;border:1px solid #dbdbdb;margin-bottom:6px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 3px #fff}
.tabs{display:flex;border-top:1px solid #efefef}
.tabs div{flex:1;display:flex;justify-content:center;padding:10px 0;border-bottom:1px solid transparent}
.tabs div.on{border-bottom:1px solid #000}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid a{position:relative;aspect-ratio:4/5;display:block;overflow:hidden;background:#eee}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .ms{position:absolute;top:8px;right:8px;width:18px;height:18px;fill:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
.empty{grid-column:span 3;text-align:center;color:#8e8e8e;font-size:13px;padding:28px 0 60px}
/* feed */
#feed{display:none}
.post{border-bottom:1px solid #efefef;padding-bottom:14px;margin-bottom:6px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ph img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.ph .u{font-weight:600;font-size:14px}
.ph .loc{font-size:12px;color:#262626}
.ph .dots{margin-left:auto;font-weight:700;letter-spacing:1px}
.car{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:start;display:block}
.cnt{position:absolute;top:12px;right:12px;background:rgba(18,18,18,.7);color:#fff;font-size:12px;padding:4px 9px;border-radius:12px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2);user-select:none}
.arr.l{left:10px}.arr.r{right:10px}
@media (hover:none){.arr{display:none}}
.act{display:flex;align-items:center;padding:10px 12px 4px;gap:16px}
.act .sp{margin-left:auto}
.pdots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;top:22px}
.act{position:relative}
.pdots i{width:6px;height:6px;border-radius:50%;background:#dbdbdb}
.pdots i.on{background:#0095f6}
.cap{padding:4px 12px 0;font-size:14px;line-height:1.5;white-space:pre-line}
.cap .u{font-weight:600;margin-right:4px}
.cap .tag{color:#00376b}
.cap.fold .rest{display:none}
.more{color:#737373;cursor:pointer}
.time{padding:6px 12px 0;font-size:11px;color:#737373}
.like{padding:2px 12px 0;font-size:14px;font-weight:600}
.foot{text-align:center;font-size:12px;color:#8e8e8e;padding:24px 16px 48px;line-height:1.6}
.heart.on path{fill:#ff3040;stroke:#ff3040}
</style>
</head>
<body>
<div class="app">
  <div class="notice">미리보기 샘플이에요. 실제 인스타그램에 올라간 게시물은 아니에요.</div>

  <!-- PROFILE -->
  <section id="profile">
    <div class="topbar">
      <div class="h">jongno_baekje_pharm <svg viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6" fill="none" stroke="#000" stroke-width="2.4"/></svg></div>
      <div class="icons">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#000" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#000" stroke-width="2"/></svg>
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#000" stroke-width="2"/></svg>
      </div>
    </div>
    <div class="prof">
      <div class="prow">
        <div class="av"><img src="avatar.jpg" alt=""></div>
        <div class="stats">
          <div><b>3</b><span>게시물</span></div>
          <div><b>0</b><span>팔로워</span></div>
          <div><b>0</b><span>팔로잉</span></div>
        </div>
      </div>
      <div class="bio">
        <div class="nm">종로백제약국(원조)</div>
        <div class="cat">약국</div>
        1971년부터 종로5가를 지켜온 약국<br>
        약사가 직접 정리한 약 정보, 저장해두고 보세요<br>
        📍 종로5가역 4번 출구 150m, 백제약국 골목 모퉁이<br>
        💳 온누리상품권 사용 가능 · ☎ 02-745-8495
      </div>
      <div class="btns"><div class="btn p">팔로우</div><div class="btn">메시지</div><div class="btn">전화</div></div>
    </div>
    <div class="hl">
      <div><i style="background-image:url(c7.jpg)"></i>오시는 길</div>
      <div><i style="background-image:url(c4.jpg)"></i>신제품</div>
      <div><i style="background-image:url(b7.jpg)"></i>감기</div>
      <div><i style="background-image:url(a2.jpg)"></i>피부</div>
    </div>
    <div class="tabs">
      <div class="on"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18" fill="none" stroke="#000" stroke-width="1.8"/></svg></div>
      <div><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#8e8e8e" stroke-width="1.8"/><path d="M10 9l5 3-5 3z" fill="#8e8e8e"/></svg></div>
      <div><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4" fill="none" stroke="#8e8e8e" stroke-width="1.8"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6" fill="none" stroke="#8e8e8e" stroke-width="1.8"/></svg></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- FEED -->
  <section id="feed">
    <div class="topbar">
      <div class="back" onclick="showProfile()">‹</div>
      <div class="h" style="flex-direction:column;gap:0;align-items:center;line-height:1.1"><span style="font-size:12px;color:#737373;font-weight:500">jongno_baekje_pharm</span><span style="font-size:16px">게시물</span></div>
      <div style="width:28px"></div>
    </div>
    <div id="posts"></div>
  </section>

  <div class="foot">블로그(blog.naver.com/baekjaepharm) 글과 사진으로 만든 샘플입니다</div>
</div>

<script>
const POSTS = [
 {k:'c', n:7, loc:'종로백제약국', time:'방금 전',
  cap:`단종 소식에 아쉬워하셨던 광동 원방 우황청심원, 다시 들어왔어요.
이번 건 사향이 들어간 원방이고, 환이랑 현탁액 두 가지예요.
'원방'이라고 다 사향 제품은 아니라서 상자 표기 보는 법도 같이 정리했어요.
찾으시던 분들은 편하게 문의 주세요.`,
  tags:'#우황청심원 #원방우황청심원 #광동우황청심원 #종로약국 #종로백제약국'},
 {k:'b', n:8, loc:'종로백제약국', time:'1일 전',
  cap:`감기 기운 있을 때 한방 감기약 찾으시는 분들, 증상마다 맞는 게 달라요.
으슬으슬하고 뒷목이 뻣뻣하면 갈근탕, 온몸이 쑤시면 패독산, 목이 아프면 은교산이나 구풍해독탕이에요.
7번째 장에 한 번에 정리해뒀으니 저장해두고 감기 올 때 꺼내 보세요.
혈압약이나 다른 한약 드시는 분은 꼭 먼저 말씀해 주세요.`,
  tags:'#한방감기약 #갈근탕 #패독산 #은교산 #구풍해독탕 #종로5가약국 #종로백제약국'},
 {k:'a', n:7, loc:'종로백제약국', time:'2일 전',
  cap:`여드름 연고 사러 와서 빨간 통, 초록 통 앞에서 고민하시는 분 정말 많아요.
붉게 부어서 아픈 여드름엔 애크논, 오돌토돌 좁쌀엔 애크린이에요.
둘 다 났으면 순서대로 같이 쓰셔도 되고요.
내 여드름이 어느 쪽인지 모르겠으면 댓글로 남겨주세요.`,
  tags:'#여드름연고 #애크논 #애크린 #좁쌀여드름 #종로약국 #종로백제약국'}
];
const ICON = {
 heart:'<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9.2C1.4 8.3 3.6 4.5 7.3 4.5c2 0 3.5 1.1 4.7 2.8 1.2-1.7 2.7-2.8 4.7-2.8 3.7 0 5.9 3.8 4.6 7.3C19.5 16.4 12 21 12 21z" fill="none" stroke="#000" stroke-width="2"/></svg>',
 cmt:'<svg viewBox="0 0 24 24"><path d="M20.7 16.5A9 9 0 1 0 17 20.3L21 21z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>',
 share:'<svg viewBox="0 0 24 24"><path d="M22 3L9.2 10.1M22 3l-7 18-3.4-8.3L2 9.5z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>',
 save:'<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V3h14z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>'
};
const grid = document.getElementById('grid'), postsEl = document.getElementById('posts');
POSTS.forEach((p,idx)=>{
  grid.insertAdjacentHTML('beforeend',`<a href="#p${idx}" onclick="openPost(${idx});return false"><img src="${p.k}1.jpg" alt=""><svg class="ms" viewBox="0 0 24 24"><path d="M7 3h11a3 3 0 0 1 3 3v11h-2V6a1 1 0 0 0-1-1H7z"/><rect x="3" y="7" width="14" height="14" rx="2"/></svg></a>`);
  const imgs = Array.from({length:p.n},(_,i)=>`<img src="${p.k}${i+1}.jpg" loading="${i<2?'eager':'lazy'}" alt="">`).join('');
  const dots = Array.from({length:p.n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  const first = p.cap.split('\n')[0], rest = p.cap.split('\n').slice(1).join('\n');
  postsEl.insertAdjacentHTML('beforeend',`
  <article class="post" id="p${idx}">
    <div class="ph"><img src="avatar.jpg" alt=""><div><div class="u">jongno_baekje_pharm</div><div class="loc">${p.loc}</div></div><div class="dots">···</div></div>
    <div class="car">
      <div class="track">${imgs}</div>
      <div class="cnt">1/${p.n}</div>
      <div class="arr l">‹</div><div class="arr r">›</div>
    </div>
    <div class="act">${ICON.heart}${ICON.cmt}${ICON.share}<div class="pdots">${dots}</div><div class="sp">${ICON.save}</div></div>
    <div class="cap fold"><span class="u">jongno_baekje_pharm</span>${first}<span class="more"> ... 더 보기</span><span class="rest">\n${rest}\n\n<span class="tag">${p.tags}</span></span></div>
    <div class="time">${p.time}</div>
  </article>`);
});
document.querySelectorAll('.post').forEach(post=>{
  const tr = post.querySelector('.track'), cnt = post.querySelector('.cnt'), dots = post.querySelectorAll('.pdots i'), n = dots.length;
  const upd = ()=>{ const i = Math.round(tr.scrollLeft/tr.clientWidth); cnt.textContent = `${i+1}/${n}`; dots.forEach((d,j)=>d.classList.toggle('on',j===i)); };
  tr.addEventListener('scroll',()=>requestAnimationFrame(upd));
  post.querySelector('.arr.l').onclick=()=>tr.scrollBy({left:-tr.clientWidth,behavior:'smooth'});
  post.querySelector('.arr.r').onclick=()=>tr.scrollBy({left:tr.clientWidth,behavior:'smooth'});
  const cap = post.querySelector('.cap'); post.querySelector('.more').onclick=()=>{cap.classList.remove('fold'); post.querySelector('.more').remove();};
  const h = post.querySelector('.heart'); h.onclick=()=>h.classList.toggle('on');
  tr.addEventListener('dblclick',()=>h.classList.add('on'));
});
function openPost(i){ document.getElementById('profile').style.display='none'; document.getElementById('feed').style.display='block'; document.getElementById('p'+i).scrollIntoView(); window.scrollBy(0,-48); history.pushState({f:1},'','#p'+i); }
function showProfile(){ document.getElementById('feed').style.display='none'; document.getElementById('profile').style.display='block'; window.scrollTo(0,0); if(location.hash) history.pushState({},'',location.pathname); }
window.addEventListener('popstate',()=>{ if(!location.hash) showProfile(); });
if (location.hash.startsWith('#p')) openPost(+location.hash.slice(2));
</script>
</body>
</html>
